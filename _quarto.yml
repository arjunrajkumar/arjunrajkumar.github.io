project:
  type: default
  output-dir: _site
  render:
    - pages/index.qmd
    - notebooks/uncompressing-a-public-key/Uncompressing a public key.ipynb
    - notebooks/proving-knowledge-of-a-secret/index.ipynb
    - notebooks/elliptical-curves/index.ipynb
    - notebooks/division-in-a-finite-field/index.ipynb
    - notebooks/finite-fields-in-cryptography/index.ipynb
    - notebooks/verifying-bitcoin-transaction-signature/index.ipynb
    - notebooks/deconstructing-a-payment-transaction/index.ipynb
  post-render:
    - python3 scripts/prepare_site.py
  resources:
    - .nojekyll
    - robots.txt
    - styles.css
    - assets/**

format:
  html:
    theme: none
    minimal: true
    toc: false
    anchor-sections: false
    section-divs: false
    code-copy: false
    code-overflow: wrap

from: markdown-smart-markdown_in_html_blocks
execute:
  enabled: false
